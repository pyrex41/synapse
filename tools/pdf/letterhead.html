<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <style>{{{css}}}</style>
  </head>
  <body>
    <header class="letterhead">
      <div class="header-inner">
        <div class="meta">
          <div class="doc-title">{{title}}</div>
          <div class="company">{{company}}</div>
          <div class="doc-date">{{date}}</div>
        </div>
        {{#if logo}}
        <img class="logo" src="{{logo}}" alt="Logo" />
        {{/if}}
        {{#if companyLogo}}
        <img class="company-logo" src="{{companyLogo}}" alt="{{company}} Logo" />
        {{/if}}
      </div>
      <hr />
    </header>

    <main class="content">
      {{{body}}}
    </main>

    <footer class="footer">
      <hr />
      <div class="footer-inner">
        <div class="left">
          {{#if footerLogo}}
          <img class="footer-logo" src="{{footerLogo}}" alt="" style="height:24px;opacity:0.5;vertical-align:middle;margin-right:8px;" />
          {{/if}}
          {{#if attribution}}{{attribution}}{{else}}{{company}}{{/if}}
        </div>
        <div class="right">{{date}}</div>
      </div>
    </footer>
  </body>
</html>
